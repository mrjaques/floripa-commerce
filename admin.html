<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Achados da Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--surface:#fff;--ink:#12302D;--muted:#5B706D;--brand:#0F4C47;--accent:#FFC233;--line:#D5DFDD;--err:#C8372D}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em}
.bar{background:var(--brand);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.bar a,.bar button{color:#fff;font:inherit;background:none;border:0;cursor:pointer;text-decoration:underline;margin-left:14px}
.wrap{max-width:980px;margin:0 auto;padding:24px 20px 56px;display:grid;gap:24px;grid-template-columns:minmax(0,360px) 1fr;align-items:start}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.login{max-width:380px;margin:12vh auto;padding:0 20px}
label{display:block;font-weight:500;font-size:.92rem;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:84px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:#2B2000;margin-top:16px}
.btn.alt{background:#fff;border:1.5px solid var(--line);color:var(--ink);margin-left:8px}
.btn.sm{padding:6px 12px;margin:0;font-size:.85rem}
.btn.del{background:#fff;border:1.5px solid var(--err);color:var(--err)}
.prev{margin-top:10px;width:120px;height:120px;border-radius:10px;object-fit:cover;background:#E3EBEA;display:none}
.msg{margin-top:12px;font-size:.92rem;min-height:1.3em}.msg.err{color:var(--err)}.msg.ok{color:var(--brand)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item img,.item .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#E3EBEA;flex:none;display:grid;place-items:center}
.item div{flex:1;min-width:0}
.item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted)}
.acts{display:flex;gap:6px;flex:none}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="box">
    <h1>Painel da loja</h1>
    <form id="lf">
      <label for="pw">Senha de administrador</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Entrar</button>
      <p class="msg err" id="lmsg" role="alert"></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <div class="bar"><strong>Painel da loja</strong><span><a href="/" target="_blank">Ver loja</a><button id="out" type="button">Sair</button></span></div>
  <div class="wrap">
    <form class="box" id="f">
      <h2 id="ft">Novo produto</h2>
      <label for="img">Imagem</label>
      <input id="img" type="file" accept="image/*">
      <img class="prev" id="prev" alt="Prévia da imagem">
      <label for="name">Descrição</label>
      <textarea id="name" maxlength="300" required placeholder="Ex.: Headset gamer com microfone"></textarea>
      <label for="cat">Categoria</label>
      <input id="cat" list="cats" maxlength="40" placeholder="Ex.: Especial GTA">
      <datalist id="cats"></datalist>
      <div class="row">
        <div><label for="price">Preço (R$)</label><input id="price" type="number" step="0.01" min="0" required></div>
        <div><label for="old">Preço antigo</label><input id="old" type="number" step="0.01" min="0" placeholder="opcional"></div>
      </div>
      <label for="link">Link de afiliado da Shopee</label>
      <input id="link" type="url" required placeholder="https://s.shopee.com.br/...">
      <button class="btn" type="submit" id="save">Salvar produto</button>
      <button class="btn alt" type="button" id="cancel" hidden>Cancelar edição</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <section class="box"><h2>Produtos <small id="n"></small></h2><div id="list"></div></section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let pw = sessionStorage.getItem('pw') || '', items = [], editing = null, imgData = null;

async function api(path, opt = {}) {
  const r = await fetch('/api/' + path, { ...opt, headers: { 'content-type': 'application/json', 'x-admin-password': pw } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error('Senha incorreta'); }
  if (!r.ok) throw new Error(d.error || 'Erro ' + r.status);
  return d;
}
function logout(){ sessionStorage.removeItem('pw'); pw = ''; $('app').hidden = true; $('login').hidden = false; }
async function enter(){
  await api('login', { method: 'POST' });
  sessionStorage.setItem('pw', pw);
  $('login').hidden = true; $('app').hidden = false;
  await load();
}
async function load(){
  items = await (await fetch('/api/products')).json();
  $('n').textContent = '(' + items.length + ')';
  $('cats').innerHTML = [...new Set(items.map(p => p.category))].map(c => `<option value="${esc(c)}">`).join('');
  $('list').innerHTML = items.length ? items.map(p => `
    <div class="item">
      ${p.image ? `<img src="${esc(p.image)}" alt="">` : '<span class="ph">🛍️</span>'}
      <div><strong>${esc(p.name)}</strong><small>${esc(p.category)} · ${brl(p.price)}</small></div>
      <span class="acts"><button class="btn sm alt" data-e="${p.id}" type="button">Editar</button><button class="btn sm del" data-d="${p.id}" type="button">Excluir</button></span>
    </div>`).join('') : '<p style="color:var(--muted);padding-top:12px">Nenhum produto ainda. Cadastre o primeiro ao lado.</p>';
}
function reset(){
  editing = null; imgData = null; $('f').reset(); $('prev').style.display = 'none';
  $('ft').textContent = 'Novo produto'; $('cancel').hidden = true;
}
function say(t, ok){ $('msg').textContent = t; $('msg').className = 'msg ' + (ok ? 'ok' : 'err'); }

$('lf').addEventListener('submit', async e => {
  e.preventDefault(); pw = $('pw').value;
  try { await enter(); $('lmsg').textContent = ''; } catch (err) { $('lmsg').textContent = err.message; }
});
$('out').onclick = logout;
$('cancel').onclick = () => { reset(); say(''); };

// Redimensiona a imagem no navegador (máx. 900px, JPEG) antes do envio
$('img').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    imgData = c.toDataURL('image/jpeg', 0.82);
    $('prev').src = imgData; $('prev').style.display = 'block';
    URL.revokeObjectURL(im.src);
  };
  im.onerror = () => say('Não foi possível ler essa imagem.');
  im.src = URL.createObjectURL(file);
});

$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('save').disabled = true; say('Salvando…', true);
  try {
    await api('products', { method: 'POST', body: JSON.stringify({
      id: editing, name: $('name').value, category: $('cat').value, price: $('price').value,
      old: $('old').value, link: $('link').value, imageData: imgData }) });
    reset(); await load(); say('Produto salvo e já está na loja.', true);
  } catch (err) { say(err.message); }
  $('save').disabled = false;
});

$('list').addEventListener('click', async e => {
  const ed = e.target.dataset.e, de = e.target.dataset.d;
  if (ed) {
    const p = items.find(x => x.id === ed); editing = p.id; imgData = null;
    $('name').value = p.name; $('cat').value = p.category; $('price').value = p.price;
    $('old').value = p.old || ''; $('link').value = p.link; $('img').value = '';
    $('prev').src = p.image || ''; $('prev').style.display = p.image ? 'block' : 'none';
    $('ft').textContent = 'Editar produto'; $('cancel').hidden = false; say('');
    $('f').scrollIntoView({ behavior: 'smooth' });
  }
  if (de && confirm('Excluir este produto da loja?')) {
    try { await api('products/' + de, { method: 'DELETE' }); if (editing === de) reset(); await load(); } catch (err) { say(err.message); }
  }
});

if (pw) enter().catch(() => {});
</script>
</body>
</html>
